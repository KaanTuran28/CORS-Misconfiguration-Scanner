[project]
name = "cors-misconfiguration-scanner"
version = "0.1.0"
description = "Scans a live URL for CORS misconfigurations: reflected-origin-with-credentials, null-origin acceptance, and origin-validation-bypass shapes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "T-X" }]
dependencies = []

[project.scripts]
cors-misconfiguration-scanner = "cors_misconfiguration_scanner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cors_misconfiguration_scanner"]

[tool.ruff]
line-length = 100
target-version = "py39"
